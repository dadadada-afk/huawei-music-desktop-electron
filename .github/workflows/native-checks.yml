name: Tinglan macOS DMG
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e 'if (process.arch !== process.env.EXPECTED_ARCH) process.exit(1)'
      - name: Fetch dependencies and license sources
        working-directory: native
        run: go mod download
      - name: Tests
        working-directory: native
        run: go test ./... -count=1 -timeout 120s
      - name: Static checks
        working-directory: native
        run: go vet ./...
      - name: UI checks
        run: npm run test:native:ui
      - name: Build unsigned DMG
        run: node native/scripts/package.mjs mac ${{ matrix.arch }}
      - name: Upload DMG and checksum
        uses: actions/upload-artifact@v4
        with:
          name: tinglan-macos-${{ matrix.arch }}-unsigned
          path: |
            release/native/darwin-${{ matrix.arch }}/*.dmg
            release/native/darwin-${{ matrix.arch }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
  release:
    name: Publish macOS release
    needs: macos
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'if (process.env.RELEASE_TAG !== "v" + require("./package.json").version) process.exit(1)'
      - uses: actions/download-artifact@v4
        with:
          pattern: tinglan-macos-*-unsigned
          path: artifacts
      - name: Verify and collect both architectures
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          for arch in arm64 x64; do
            dir="artifacts/tinglan-macos-${arch}-unsigned"
            (cd "$dir" && sha256sum --check SHA256SUMS)
            cp "$dir"/*.dmg release-assets/
            cat "$dir/SHA256SUMS" >> release-assets/SHA256SUMS
          done
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag --latest --title "听澜 Tinglan $RELEASE_TAG（macOS 测试版）" \
            --notes-file docs/RELEASE_NOTES.md
